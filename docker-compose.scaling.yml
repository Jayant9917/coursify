services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  api:
    build:
      context: ./Backend
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URL: ${MONGODB_URL:?Set MONGODB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      EMAIL_FROM_NO_REPLY: ${EMAIL_FROM_NO_REPLY:?Set EMAIL_FROM_NO_REPLY}
      EMAIL_FROM_SECURITY: ${EMAIL_FROM_SECURITY:?Set EMAIL_FROM_SECURITY}
      EMAIL_FROM_NOTIFICATIONS: ${EMAIL_FROM_NOTIFICATIONS:?Set EMAIL_FROM_NOTIFICATIONS}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:?Set EMAIL_REPLY_TO}
      LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY:?Set LEMONSQUEEZY_API_KEY}
      LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID:?Set LEMONSQUEEZY_STORE_ID}
      LEMONSQUEEZY_PRODUCT_ID: ${LEMONSQUEEZY_PRODUCT_ID:-}
      LEMONSQUEEZY_VARIANT_ID: ${LEMONSQUEEZY_VARIANT_ID:?Set LEMONSQUEEZY_VARIANT_ID}
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:?Set LEMONSQUEEZY_WEBHOOK_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:?Set AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?Set AWS_S3_BUCKET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?Set CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?Set CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?Set CLOUDINARY_API_SECRET}
      MEDIA_STORAGE_PROVIDER: s3
      COURSE_APPROVAL_REQUIRED: "false"
      REDIS_URL: redis://redis:6379
      QUEUE_ENABLED: "true"
      METRICS_ENABLED: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRUST_PROXY: "true"
    depends_on:
      - redis
    ports:
      - "3002:3002"
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  redis-data:
